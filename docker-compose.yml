version: '3.8'

services:
  minio:
    image: craftslab/minio:latest
    container_name: minio
    # Port 9000 is exposed for console API access, also proxied via nginx for public access
    # Port 9001 is exposed directly for console UI access
    ports:
      - "9000:9000"  # MinIO API (direct access for console, also proxied via nginx)
      - "9001:9001"  # MinIO Console (direct access)
    volumes:
      # Bind mount: Map local path to /data in container
      # Use relative path (./data) or absolute path (/path/to/minio/data)
      # Example: - /path/to/minio/data:/data
      - ./data:/data
      # Mount certificates directory for HTTPS support
      # Place your SSL certificates in ./certs directory
      # MinIO will automatically detect and use certificates named:
      # - public.crt for the certificate
      # - private.key for the private key
      # Commented out since nginx handles SSL termination
      # - ./certs:/root/.minio/certs
      # Alternative: Use named volume
      # - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address :9001
    restart: unless-stopped
    networks:
      - minio-network
    # Optional: Add healthcheck if wget/curl is available in the image
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
    #   interval: 30s
    #   timeout: 20s
    #   retries: 3
    #   start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: minio-nginx
    ports:
      - "80:80"      # HTTP (redirects to HTTPS)
      - "443:443"    # HTTPS for S3 API and Console
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - minio-network

# Networks
networks:
  minio-network:
    driver: bridge

# Named volume (only needed if using named volume instead of bind mount)
# volumes:
#   minio-data:
#     driver: local
